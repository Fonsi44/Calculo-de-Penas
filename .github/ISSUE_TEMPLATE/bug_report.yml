name: Bug
description: Reportar un comportamiento reproducible
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Comportamiento observado
      description: Incluye ruta, rol y resultado, sin datos personales ni secretos.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducción mínima
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Entorno
      options:
        - Local
        - Preview
        - Staging
        - Production
    validations:
      required: true
