name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Higiene, Lint, TypeScript, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      CRON_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: '1'
      PORT: '3100'
      NEXT_PUBLIC_SITE_URL: https://www.pinedayasociadoshn.com
      NEXT_PUBLIC_SITE_NAME: "Pineda y Asociados"
      NEXT_PUBLIC_NOINDEX: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup npm version
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repo hygiene
        run: node tools/ci/repo-hygiene.mjs

      - name: Migrations validate
        run: npm run db:migrations:validate

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
