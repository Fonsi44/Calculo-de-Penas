name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Higiene, Lint, TypeScript, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      CRON_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: '1'
      PORT: '3100'
      NEXT_PUBLIC_SITE_URL: https://www.pinedayasociadoshn.com
      NEXT_PUBLIC_SITE_NAME: "Pineda y Asociados"
      NEXT_PUBLIC_NOINDEX: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup npm version
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repo hygiene
        id: hygiene
        run: node tools/ci/repo-hygiene.mjs

      - name: Governance
        id: governance
        run: npm run governance

      - name: Docs links
        id: docs
        run: npm run docs:links

      - name: Migrations validate
        id: migrations
        run: npm run db:migrations:validate

      - name: Lint
        id: lint
        run: npm run lint

      - name: TypeScript
        id: typescript
        run: npx tsc --noEmit

      - name: Tests
        id: tests
        run: npm test

      - name: Build
        id: build
        run: npm run build:ci

      - name: Knip baseline
        id: knip
        run: npm run repo:knip

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI — Resumen"
            echo ""
            echo "| Gate | Resultado |"
            echo "| --- | --- |"
            echo "| Repo hygiene | ${{ steps.hygiene.outcome }} |"
            echo "| Governance | ${{ steps.governance.outcome }} |"
            echo "| Docs links | ${{ steps.docs.outcome }} |"
            echo "| Migrations validate | ${{ steps.migrations.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| TypeScript | ${{ steps.typescript.outcome }} |"
            echo "| Tests | ${{ steps.tests.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Knip | ${{ steps.knip.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
