name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 alineado con el entorno local. setup-node@v4 no soporta
          # `npm-version`, se instala npm 11 en el step siguiente.
          node-version: '22'
          cache: 'npm'

      - name: Install npm 11 (alineado con el generador del lock)
        # npm 10.x (default del runner) rechaza el package-lock.json generado
        # por npm 11 por la validación estricta de optionalDependencies de
        # esbuild (tsx -> @esbuild/* 0.28.1 con 26 platform binaries).
        # Alinear a npm 11 resuelve el `npm ci`.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate seed data
        run: |
          node -e "const d=require('./data/delitos.json'); console.log('delitos:', d.length)"
          node -e "const d=require('./data/delitos.json'); const s=new Set(d.map(x=>x.nombre+'|'+x.articulo)); console.log('duplicados:', d.length - s.size)"
          node -e "const d=require('./data/delitos-estados.json'); console.log('estados:', d.total_registros, '(', d.verificados, 'OK,', d.pendientes_revision, 'revisar,', d.rechazados, 'rechazados)')"

      # Validación de fechas del blog: ningún post con fecha futura ni orden
      # incorrecto. El script sale limpio (exit 0) si DATABASE_URL no está
      # configurada o es placeholder, así que no bloquea PRs sin acceso a DB.
      - name: Validate blog dates
        run: npm run validate:dates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # NOTA: content:audit (npm run content:audit) NO se añade al CI todavía.
      # Actualmente hay 71 posts con revisión editorial vencida (pendiente
      # humano, no bug técnico — ver docs/plan-reescritura-blog.md). Añadirlo
      # cuando el ciclo de revisión trimestral esté al día.
      # - name: Content audit
      #   run: npm run content:audit
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    # El job `quality` (lint/tsc/test/build) es obligatorio en cada push/PR.
    # El job `e2e` solo corre cuando `quality` pasa, para no desperdiciar
    # minutos de CI en código que ya no compila o no pasa los unit tests.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: '1'
      PORT: '3100'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm 11 (alineado con el generador del lock)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            **/trace.zip
          if-no-files-found: ignore
          retention-days: 7
